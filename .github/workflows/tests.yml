name: tests

# push is filtered to main on purpose: with `pull_request:` also enabled, an
# unfiltered push trigger runs every PR commit twice. Branch work is covered by
# the PR trigger; both routes into main - a merge and a direct push - fire the
# push trigger. A feature branch with no PR runs nothing, which is the trade.
#
# Cost: this job used to run on macOS, billed at 10x a Linux minute, for about 11 minutes.
# 100 runs in two days (83 on one of them) came from every push to a PR branch starting a
# fresh run while the last one was still going. Now: it runs on Linux, a newer push to the
# same ref cancels the older run, a change that touches no code or test starts nothing, and
# a draft PR starts nothing until it is marked ready. The launchd suites stay on macOS in
# launchd.yml and run only when a launchd file changes.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'example/**'
      - 'LICENSE'
  pull_request:
    # ready_for_review is not a default type: without it, marking a draft ready starts nothing
    # and the job's draft skip would leave the PR with no test run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'example/**'
      - 'LICENSE'

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite is split into four shards that run at once, each a quarter of the tests and unit
  # suites chosen round-robin (RUNALL_SHARD=i/n in tests/run-all.sh; tests/shard.sh proves the
  # shards partition the suite exactly). One job ran them all in 6 to 7 minutes of a run that took
  # 9; the shards finish in about two. Keep the matrix and the /4 below in step: tests/shard.sh
  # fails if they disagree, because a shard that no job runs is a quarter of the suite nobody runs.
  # The unit suites used to run a second time in their own step here. run-all.sh already runs every
  # one of them, so that step only repeated 47 seconds of work.
  shards:
    name: test (${{ matrix.shard }}/4)
    # Linux. The suites went through bin/portable.sh for the BSD and GNU date and stat, so
    # they no longer need a Mac. The suites that drive launchd (install, scheduler-label,
    # autodream-now) run in launchd.yml on macOS, and only when launchd files change.
    # Every suite runs against tests/mock-claude.sh, so nothing here needs a model.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      # gtimeout: four oversized-gate assertions look for GNU timeout under that name,
      # which is how it is installed on a Mac. On Linux it is plain `timeout`.
      - name: check deps
        run: |
          jq --version
          python3 --version
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v timeout)" "$HOME/.local/bin/gtimeout"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: run-all, shard ${{ matrix.shard }} of 4
        env:
          RUNALL_TIMES: ${{ runner.temp }}/times.txt
        run: RUNALL_SHARD=${{ matrix.shard }}/4 bash tests/run-all.sh

      # What this shard spent its time on, slowest first. Run on failure too: a slow shard is
      # exactly when this is wanted. The split is round-robin by position; if one shard keeps
      # finishing well behind the others, these numbers are what a weighted split needs.
      - name: slowest entries in this shard
        if: always()
        env:
          RUNALL_TIMES: ${{ runner.temp }}/times.txt
        run: |
          test -f "$RUNALL_TIMES" || { echo "no timings written"; exit 0; }
          awk '{ t += $1 } END { print "total seconds in tests and suites: " t }' "$RUNALL_TIMES"
          sort -rn "$RUNALL_TIMES" | head -12

  # One check that stands for the four shards, under the name the single job always had, so
  # anything that waits on `test` keeps working. A draft PR skips the shards and so skips this.
  test:
    needs: shards
    # !cancelled(), not always(): a newer push cancels this run, and the shards then read as cancelled.
    # always() would run this job anyway and fail it, painting the superseded commit red.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every shard passed
        env:
          SHARDS: ${{ needs.shards.result }}
        run: |
          echo "shards: $SHARDS"
          test "$SHARDS" = success

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The shipped scripts are held at `warning`. A cron job nobody watches
      # cannot afford a swallowed exit code, and that is the class shellcheck
      # actually catches (SC2164, SC2155).
      - name: shellcheck bin + install
        run: shellcheck --severity=warning bin/*.sh adapters/*/*.sh install.sh

      # Test code is held at `error` only. tests/run-all.sh has ~24 SC2155
      # hits from `local x=$(cmd)` in assertion helpers, where masking a return
      # value has no consequence. Tighten this if that stops being true.
      - name: shellcheck tests
        run: shellcheck --severity=error tests/*.sh
